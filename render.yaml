services:
  - type: web
    name: jobtrail
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      # Gmail import — fill these in on the Render dashboard (Environment tab)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS          # optional: leave empty to allow every Google test user
        sync: false
      - key: ADMIN_EMAILS            # who may use the SQL console (sees everyone's data)
        sync: false
      # Keeps your data across restarts (free Turso database) — see README "Keep data on Render"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
